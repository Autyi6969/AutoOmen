# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Gradle itself must run on Java 25 (Loom 1.18 needs it): pass -Dorg.gradle.java.home=<JDK 25> on the
# command line. The Java toolchain below (build.gradle) then compiles and runs the game with that JDK.
org.gradle.java.installations.auto-download=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft 26.x ships unobfuscated, so there are no Yarn mappings (meta.fabricmc.net lists none for 26.2).
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
mod_version=0.1.0+26.3
maven_group=io.github.autyism.autoomen
archives_base_name=autoomen

# Dependencies
fabric_api_version=0.161.0+26.3
modmenu_version=21.0.0
